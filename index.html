<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جدول امتیازات گروه‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#6b7480;--ac:#1f7a5c;--ln:#e3e6ea;--hd:#e9f3ef}
@media(prefers-color-scheme:dark){:root{--bg:#14181c;--card:#1c2228;--tx:#e8ebee;--mu:#98a2ad;--ac:#4cc29a;--ln:#2d353d;--hd:#22302b}}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;margin:8px 0}h2{font-size:1.1rem;margin:0 0 10px}h3{font-size:.95rem;margin:14px 0 6px;color:var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:16px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
button,input{font:inherit}
.tabs button{border:1px solid var(--ln);background:var(--card);color:var(--tx);padding:4px 12px;border-radius:20px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.88rem}
th,td{border-bottom:1px solid var(--ln);padding:6px 8px;text-align:center;white-space:nowrap}
th{background:var(--hd)}td:first-child,th:first-child{text-align:right}
tr.avg td{font-weight:700;background:var(--hd)}
.code{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1;min-width:140px;padding:8px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);text-align:center;letter-spacing:4px}
.go{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 20px;cursor:pointer}
.err{color:#d33;margin:6px 0 0;min-height:1.4em}.mu{color:var(--mu);font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>📊 جدول امتیازات گروه‌ها</h1>
<div class="card">
<h2>جمع‌بندی گروه‌ها</h2>
<div class="tabs" id="st"></div>
<div class="w" id="sum">در حال بارگذاری…</div>
<p class="mu" id="upd"></p>
</div>
<div class="card">
<h2>🔑 مشاهده جزئیات گروه</h2>
<div class="code"><input id="c" inputmode="numeric" maxlength="4" placeholder="کد گروه"><button class="go" id="b">نمایش</button></div>
<p class="err" id="e"></p>
</div>
<div id="d"></div>
</main>
<script>
/* ===== تنظیمات: فقط این بخش را ویرایش کنید ===== */
const DASH="1kpRMWU2XmoHptQKSkjkcJ0QOLM8vgcYSp_RXEdyzu7c";
const LEAGUE_SHEET="جدول تجمیعی کل لیگ";
const GROUPS={ // کد : [نام گروه، شناسه‌ی شیت]
"4817":["گروه شهید مطهری (آقای قیصری)","1JugzjfmtDw8Q7F-3tkDgFllvGG2FQpOUWJoEhxPDCFQ"],
"2953":["گروه شهید حاجی‌زاده (آقای رفیعی)","1A8Y7G1KeeoSWgONnTzhbjYqNGcSbpco-mMY03y9R4gY"],
"7260":["گروه مجانین الرقیه (آقای فرجی)","1l04e5o2AqTrchcwreIRlnt5PsU5Gbma7JPDgTn7GHI8"],
"1384":["گروه شهید صدرزاده (آقای روشن‌ضمیر)","1ikpqofOoAW_dr1lMDzOuGey4Z1MjWIHDcdOMB_d1kG8"],
"6095":["گروه شهید آرمان علی‌وردی (آقای عسگری)","1HOt2CfsgpmD3o5BjAFUsYOHpCECVaoWHYaJ1fnKsVtc"],
"3729":["گروه رهبر شهید (آقای سنایی)","1M47DhQrIgJIc4trqvyL7nEnEMaZJsirvXgim6mruJfU"]};
const MAXW=10; // حداکثر تعداد هفته‌ای که بررسی می‌شود
/* ============================================== */
const H=["طرح مطالعاتی","اخلاق حجره‌داری","امتحان هفتگی","کتاب‌خوانی","حفظ الفیه","ورزش","المپیاد","ماموریت ویژه"];
const $=id=>document.getElementById(id);
const pd=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const fa=v=>{const n=parseFloat(v);return isNaN(n)?"–":(+n.toFixed(2)).toLocaleString("fa-IR",{maximumFractionDigits:2})};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function csv(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
else if(c=='"')q=true;else if(c==","){row.push(f);f=""}
else if(c=="\n"||c=="\r"){if(c=="\r"&&t[i+1]=="\n")i++;row.push(f);r.push(row);row=[];f=""}else f+=c}
if(f||row.length){row.push(f);r.push(row)}return r.map(x=>x.map(s=>s.trim()))}
async function sheet(id,name){const u=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(name)}`;
const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.text()}
async function weeks(id){const out=[];for(let w=1;w<=MAXW;w++){let t;try{t=await sheet(id,"هفته "+pd(w))}catch(e){if(w==1)throw e;break}
if(out.some(o=>o.t==t))break; /* شیت ناموجود، شیت اول را برمی‌گرداند */ out.push({w,t})}return out}
function tbl(head,rows){return"<table><tr>"+head.map(h=>"<th>"+esc(h)+"</th>").join("")+"</tr>"+rows.map(r=>"<tr"+(r.c?` class="${r.c}"`:"")+">"+r.t.map(x=>"<td>"+x+"</td>").join("")+"</tr>").join("")+"</table>"}
function err(el,e){el.innerHTML=`<p class="err">خطا در دریافت اطلاعات. مطمئن شوید شیت روی «هر کسی که لینک را دارد، بیننده» تنظیم شده است.</p>`;console.error(e)}
/* ---------- صفحه اول ---------- */
let DW=[],LG="";
function showLeague(){const rows=csv(LG).filter(r=>r[0].startsWith("گروه")&&r.length>=6).map(r=>({n:r[0],w:[1,2,3,4].map(i=>parseFloat(r[i])||0),s:parseFloat(r[5])||0})).sort((a,b)=>b.s-a.s);
const nw=Math.max(2,...rows.map(r=>r.w.reduce((m,x,i)=>x?i+1:m,0)));
$("sum").innerHTML=tbl(["رتبه / گروه",...[...Array(nw)].map((_,i)=>"هفته "+pd(i+1)),"جمع کل"],rows.map((r,i)=>({t:[pd(i+1)+". "+esc(r.n),...r.w.slice(0,nw).map(fa),"<b>"+fa(r.s)+"</b>"]})))}
function showWeek(k){const rows=csv(DW[k].t).filter(r=>r[0].startsWith("گروه")&&r.length>=9);const seen={};
const l=rows.filter(r=>!seen[r[0]]&&(seen[r[0]]=1)).map(r=>({n:r[0],a:r.slice(1,9),s:r.slice(1,9).reduce((x,y)=>x+(parseFloat(y)||0),0)})).sort((a,b)=>b.s-a.s);
$("sum").innerHTML=tbl(["رتبه / گروه",...H,"مجموع"],l.map((r,i)=>({t:[pd(i+1)+". "+esc(r.n),...r.a.map(fa),"<b>"+fa(r.s)+"</b>"]})))}
function tabs(){$("st").innerHTML=`<button data-k="L" class="on">کل لیگ</button>`+DW.map((o,i)=>`<button data-k="${i}">هفته ${pd(o.w)}</button>`).join("")}
$("st").onclick=e=>{const k=e.target.dataset.k;if(k===undefined)return;[...$("st").children].forEach(b=>b.classList.toggle("on",b==e.target));k=="L"?showLeague():showWeek(+k)};
async function init(){try{[LG,DW]=await Promise.all([sheet(DASH,LEAGUE_SHEET),weeks(DASH)]);tabs();showLeague();$("upd").textContent="اطلاعات مستقیماً از شیت خوانده می‌شود؛ با رفرش صفحه به‌روز می‌شود."}catch(e){err($("sum"),e)}}
/* ---------- جزئیات گروه ---------- */
function parseWeek(t){const rows=csv(t),days=[];let cur=null,avg=null;
rows.forEach(r=>{if(r.length<10||r[0]=="تاریخ")return;const lab=r[0]=="میانگین نهایی"||r[1]=="میانگین نهایی";
if(lab){avg=r.slice(2,10);return}
if(r[0]){cur={d:r[0],r:[]};days.push(cur)}
if(!cur||!r[1]||r[1]=="معدل")return;const v=r.slice(2,10);cur.r.push({n:r[1],v})});
return{days:days.map(d=>({d:d.d,r:d.r.filter(p=>p.v.some(x=>x!==""))})).filter(d=>d.r.length),avg}}
function showGroup(name,W,k){const w=parseWeek(W[k].t),tot={};
let h=`<div class="card"><h2>${esc(name)}</h2><div class="tabs" id="wt">`+W.map((o,i)=>`<button data-k="${i}" class="${i==k?"on":""}">هفته ${pd(o.w)}</button>`).join("")+"</div>";
if(!w.days.length)h+=`<p class="mu">برای این هفته هنوز امتیازی ثبت نشده.</p>`;
w.days.forEach(d=>{h+=`<h3>${esc(d.d)}</h3><div class="w">`+tbl(["نام",...H],d.r.map(r=>({t:[esc(r.n),...H.map((_,i)=>fa(r.v[i]))]})))+"</div>";
d.r.forEach(r=>{tot[r.n]=tot[r.n]||H.map(()=>0);H.forEach((_,i)=>tot[r.n][i]+=parseFloat(r.v[i])||0)})});
if(w.days.length){h+=`<h3>جمع امتیاز هر نفر در این هفته</h3><div class="w">`+tbl(["نام",...H],Object.entries(tot).map(([n,a])=>({t:[esc(n),...a.map(fa)]})))+"</div>";
if(w.avg)h+=`<h3>میانگین نهایی گروه (طبق شیت)</h3><div class="w">`+tbl(["",...H],[{c:"avg",t:["میانگین نهایی",...w.avg.map(fa)]}])+"</div>"}
$("d").innerHTML=h+"</div>";$("wt").onclick=e=>{if(e.target.dataset.k!==undefined)showGroup(name,W,+e.target.dataset.k)}}
async function go(){const v=$("c").value.trim().replace(/[۰-۹]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c));
if(!GROUPS[v]){$("e").textContent="کد واردشده معتبر نیست.";$("d").innerHTML="";return}
$("e").textContent="";$("d").innerHTML=`<div class="card">در حال بارگذاری…</div>`;
try{const [name,id]=GROUPS[v];const W=await weeks(id);showGroup(name,W,W.length-1);$("d").scrollIntoView({behavior:"smooth"})}catch(e){err($("d"),e)}}
$("b").onclick=go;$("c").onkeydown=e=>{if(e.key=="Enter")go()};
init();
</script>
</body>
</html>
